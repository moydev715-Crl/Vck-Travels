<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Vck Travels</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Nunito", "Segoe UI", sans-serif;
            background-image: url("./pexels-frandany-227885104-19911890.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container-logo {
            color: aliceblue;
            font-size: 22px;
            font-weight: 700;
            margin-right: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .img-logo {
            height: 80px;
            width: auto;
            display: block;
        }

        .navBar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #168AAD 0%, #16B8A6);
            padding: 15px 30px;
            color: white;
        }

        .navBar a {
            color: #123047;
            text-decoration: none;
            font-weight: 600;
        }

        .navBar a:hover {
            color: #16B8A6;
        }

        .navBar-menu {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 10px;
        }

        .navBar-menu a:hover {
            color: aliceblue;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .search-container input {
            width: 220px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .search-container button:hover {
            color: aquamarine;
        }

        .btn-search,
        .btn-clear {
            border-radius: 10px;
            border: 1px;
        }

        .contact-main {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 50px 6%;
        }

        textarea {
            font-family: inherit;
        }

        .card-form {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            box-sizing: border-box;

            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 18px;

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        }

        .card-form h1 {
            text-align: center;
            color: #126782;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .form-description {
            text-align: center;
            color: #444;
            margin: 0 0 25px;
        }

        .card-form form {
            display: flex;
            flex-direction: column;
        }

        .card-form label {
            color: #164e63;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .card-form input,
        .card-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 20px;

            border: 1px solid rgba(22, 138, 173, 0.4);
            border-radius: 8px;

            background: rgba(255, 255, 255, 0.75);
            color: #222;
            font-size: 15px;

            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .card-form input:focus,
        .card-form textarea:focus {
            border-color: #168AAD;
            box-shadow: 0 0 0 3px rgba(22, 138, 173, 0.15);
        }

        .card-form textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            padding: 13px;
            border: none;
            border-radius: 8px;

            background: #168AAD;
            color: white;

            font-size: 16px;
            font-weight: 700;
            cursor: pointer;

            transition: background 0.3s, transform 0.3s;
        }

        .btn-submit:hover {
            background: #126782;
            transform: translateY(-2px);
        }

        @media (max-width: 800px) {
            .contact-main {
                justify-content: center;
                padding: 30px 15px;
            }
        }

        @media (max-width: 600px) {
            .card-form {
                padding: 25px 20px;
            }
        }

        .footer {
            background: linear-gradient(90deg, #168AAD 0%, #16B8A6);
            padding: 35px 30px 15px;
            color: white;
        }

        .footer-content {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            text-align: center;
        }

        .footer-content h3 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .footer-content p {
            line-height: 1.8;
            font-size: 14px;
        }

        .footer-social {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .social-icons {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .social-icons a {
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            text-decoration: none;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .social-icons img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            display: block;
        }

        .social-icons a:hover {
            transform: translateY(-5px);
            background-color: rgba(255, 255, 255, 0.35);
        }

        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            margin-top: 30px;
            padding-top: 15px;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .footer-content {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .social-icons {
                gap: 10px;
            }

            .content-card,
            .about-card {
                margin: 30px 15px;
            }
        }

        .results-section {
            width: min(1200px, calc(100% - 40px));
            box-sizing: border-box;
            margin: 30px auto 0;
            padding: 30px;
            color: white;
            background: rgba(18, 48, 71, 0.55);
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        .results-title {
            text-align: center;
            font-weight: 700;
            margin: 0 0 25px;
        }

        .results-message {
            text-align: center;
            font-size: 18px;
            margin: 0;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 340px));
            justify-content: center;
            gap: 25px;
        }

        .place-card {
            background: rgba(255, 255, 255, 0.92);
            color: #123047;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .place-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .place-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .place-card img.img-fallback {
            object-fit: contain;
            padding: 25px;
            box-sizing: border-box;
            background: linear-gradient(90deg, #168AAD 0%, #16B8A6);
        }

        .place-info {
            padding: 18px 20px 22px;
        }

        .place-info h3 {
            color: #123047;
            font-size: 20px;
            margin: 0 0 10px;
        }

        .place-info p {
            color: #123047;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navBar">
            <div class="container-logo">
                <img src="logo-agencia-viajes.png" class="img-logo" alt="VCK Travels logo">
                VCK TRAVELS
            </div>

            <ul class="navBar-menu">
                <li><a href="index.html">Home page</a></li>
                <li><a href="aboutUs.html">About Us</a></li>
                <li><a href="contactUs.html">Contact us</a></li>
            </ul>

            <div class="search-container">
                <input type="text" id="searchIn" placeholder="Enter a keyWord" maxlength="30">
                <button onclick="search()" class="btn-search">Search</button>
                <button onclick="clearSearch()" class="btn-clear">Clear</button>
            </div>
        </nav>
    </header>

    <main class="contact-main">
        <div class="card-form">
            <form action="#" method="post">

                <h1>Contact Us</h1>
                <p class="form-description">We would love to hear from you!</p>

                <label for="nameCU">Name</label>
                <input type="text" id="nameCU" name="name" placeholder="Enter your name" maxlength="50" required>

                <label for="emailCU">Email</label>
                <input type="email" id="emailCU" name="email" placeholder="Enter your email" maxlength="50" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Enter your message" rows="5" required></textarea>

                <button type="submit" class="btn-submit">Send Message</button>

            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">

            <div class="footer-description">
                <h3>Vck Travels</h3>
                <p>
                    Discover the world with us.
                    Your next adventure starts here!
                </p>
            </div>

            <div class="footer-contact">
                <h3>Contact Us</h3>
                <p>Email: contact@vcktravels.com</p>
                <p>Phone: +52 55 1234 5678</p>
            </div>

            <div class="footer-social">
                <h3>Follow Us</h3>
                <div class="social-icons">
                    <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                        <img src="./facebook.png" alt="Facebook">
                    </a>
                    <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                        <img src="./instagram.png" alt="Instagram">
                    </a>
                    <a href="https://www.x.com/" target="_blank" rel="noopener noreferrer" aria-label="X">
                        <img src="./x.png" alt="X">
                    </a>
                    <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                        <img src="./youtube.png" alt="YouTube">
                    </a>
                </div>
            </div>

        </div>

        <div class="footer-bottom">
            <p>JavaSript Essentials Final Project</p>
        </div>
    </footer>
    <script src="./js/travel_recomendations.js"></script>
</body>
</html>
